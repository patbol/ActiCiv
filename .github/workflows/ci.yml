name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
  database-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate exact clean SHA
        run: pnpm release:verify --rebuild-db | tee /tmp/acticiv-quality.log
      - name: Collect canonical quality evidence (advisory during D review)
        if: always()
        continue-on-error: true
        run: pnpm quality:collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-snapshots-${{ github.sha }}
          path: .quality/snapshots/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-closure-${{ github.sha }}
          path: /tmp/acticiv-quality.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
      - run: pnpm db:stop
        if: always()
